name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed by ref so branches never cancel each other, and pull requests only: a
# `push` run is the record of what landed on main, and cancelling it leaves that
# commit with no verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        # Held at v5 on purpose: v6 moved the caching this step relies on into
        # gradle-actions-caching, a proprietary component under Gradle's own
        # Terms of Use rather than the MIT licence. v5 is the last release that
        # runs on Node 24 without that decision attached.
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting
        # First, and blocking: ktlint is deterministic, needs no Android SDK and
        # cannot flake, so a failure here always means the diff is genuinely
        # unformatted. `./gradlew spotlessApply` fixes it.
        run: ./gradlew spotlessCheck --stacktrace

      # Every step below runs even when an earlier one failed, so one red gate
      # never hides the verdict of the others.
      - name: Run unit tests
        if: always()
        run: ./gradlew :library:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: library/build/reports/tests
          if-no-files-found: ignore

      - name: Verify coverage
        # The 90% bound is configured in library/build.gradle, filtered to the
        # watcher and the utilities. koverLog prints the figure next to the
        # verdict — a red run should say what the number was, not only that it
        # was too low.
        if: always()
        run: ./gradlew :library:koverVerifyDebug :library:koverLogDebug --stacktrace

      - name: Run detekt
        # Everything detekt finds today is frozen in the detekt-baseline-*.xml
        # files, so a failure means the diff added a smell. Regenerate a baseline
        # only with a reason — see CLAUDE.md.
        if: always()
        run: ./gradlew detektAll --stacktrace

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            library/build/reports/detekt
            sample/build/reports/detekt
          if-no-files-found: ignore

      - name: Run Android Lint
        # Blocking now that `lint { abortOnError true; warningsAsErrors true }`
        # and the two lint-baseline.xml files are in place: what existed is
        # frozen, so a failure here means the diff added a finding.
        if: always()
        run: ./gradlew :library:lintDebug :sample:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            library/build/reports/lint-results-debug.*
            sample/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Check binary compatibility
        # The artifact goes to Maven Central and a release cannot be withdrawn,
        # so an accidental signature change has to be caught before the merge,
        # not by the people whose build stops compiling. library/api/library.api
        # is the dump of the public API; a mismatch prints the diff. An intended
        # change is made reviewable by running `./gradlew :library:updateKotlinAbi`
        # and committing the result.
        if: always()
        run: ./gradlew :library:checkKotlinAbi --stacktrace

      - name: Assemble
        # The instrumented tests are compiled here and run in the `instrumented`
        # job below: compiling them in this job keeps a pull request from landing
        # a source set that no longer builds, without paying for an emulator.
        if: always()
        run: ./gradlew assemble :library:compileDebugAndroidTestSources --stacktrace

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # Deliberately not on pull requests: the emulator costs about ten minutes,
    # and the two Views it covers change rarely. On a push to main the verdict
    # arrives minutes after the merge, and `Release` runs the same tests again as
    # a gate before publishing, so a regression here can never reach Maven
    # Central.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        # Held at v5 for the same reason as the job above.
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        # Without it the emulator falls back to software rendering and the job
        # takes long enough to be useless.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        # API 24 is this library's minSdk: the level where an API-level mistake
        # actually shows up. A newer level is covered by every developer's own
        # device.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          script: ./gradlew :library:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: library/build/reports/androidTests
          if-no-files-found: ignore
