plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.maven.publish)
    alias(libs.plugins.kover)
}

android {
    namespace 'ru.pravbeseda.currencyedittext'
    compileSdk 37

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main.res.srcDirs = [
                'src/main/res',
                'src/main/res-public'
        ]
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }

    // The public API gate, and the only one here that looks at the artifact's
    // outward boundary. It is the Kotlin plugin's own feature rather than the
    // standalone binary-compatibility-validator it replaced in #21: same
    // reference file and, byte for byte, the same dump, with one dependency
    // fewer. `checkKotlinAbi` is wired into `check` by the plugin; an intended
    // change is committed by running `updateKotlinAbi`.
    abiValidation {
        enabled = true
    }
}

dependencies {
    implementation libs.androidx.appcompat

    api libs.material

    testImplementation libs.junit
    testImplementation libs.androidx.test.core.ktx
    testImplementation libs.androidx.test.ext.junit.ktx
    testImplementation libs.mockito.core

    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.ext.junit.ktx
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
}

// Coverage is measured on :library only, and filtered by class. The two Views
// cannot be reached from src/test — they need a real Android runtime — so an
// unfiltered figure would report the share of View code in the module rather
// than the quality of the tests, and would sink whenever a View grew. The
// filter leaves the code the JVM tests actually exercise: the watcher and the
// utilities. :sample is left out entirely; it is a demo with no tests.
kover {
    reports {
        filters {
            includes {
                classes(
                        'ru.pravbeseda.currencyedittext.calculator.*',
                        'ru.pravbeseda.currencyedittext.watchers.*',
                        'ru.pravbeseda.currencyedittext.util.*'
                )
            }
            excludes {
                // The calculator's panel is the one class of that package that
                // touches Android, and it is out of the filter for the same
                // reason as the two Views: src/test cannot reach it, so its
                // lines would measure the size of the panel rather than the
                // quality of the tests. Everything it decides — key semantics,
                // arithmetic, the expression line — lives in CalculatorState
                // and ExpressionEvaluator, which are measured.
                classes('ru.pravbeseda.currencyedittext.calculator.CalculatorPopup')
            }
        }
        variant('debug') {
            // Coverage lands in the build log of every `check`, so the number is
            // visible without generating and opening a report.
            log {
                onCheck = true
            }
            verify {
                onCheck = true
                rule {
                    // 80, against the 86% the filtered classes sit at today: the
                    // floor has to leave room for a branch landing with its edge
                    // cases covered a commit later, or it stops being a floor and
                    // becomes a reason to argue with the build. It rises when the
                    // margin turns out to be unused, never as a reaction to a red
                    // run.
                    minBound(80)
                }
            }
        }
    }
}

apply from: '../spotless.gradle'
