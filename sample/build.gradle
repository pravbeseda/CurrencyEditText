plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'pravbeseda'
    compileSdk 37

    compileOptions {
        sourceCompatibility 11
        targetCompatibility 11
    }

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        applicationId "ru.pravbeseda.currencyedittext"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode VERSION_CODE.toInteger()
        versionName VERSION_NAME
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation project(':library')
    // kotlin.stdlib.default.dependency is off project-wide — see gradle.properties — so the
    // demo declares the stdlib itself. Nothing here needs a newer one than the library's.
    implementation libs.kotlin.stdlib
    implementation libs.androidx.core.ktx
    implementation libs.material
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
}

apply from: '../spotless.gradle'

// Under AGP's built-in Kotlin the detekt plugin hands its typed tasks the
// libraries but not this module's own Java classes — here the generated view
// bindings — so every reference to one is unresolved and the typed rules misfire
// without failing. After evaluation, because the plugin registers these tasks
// from onVariants, and an earlier `from` would replace its classpath instead of
// extending it.
afterEvaluate {
    def javaClasses = tasks.named('compileDebugJavaWithJavac').flatMap { it.destinationDirectory }
    tasks.matching { it.name ==~ /detekt(Baseline)?Debug(UnitTest|AndroidTest)?/ }
        .configureEach { classpath.from(javaClasses) }
}
