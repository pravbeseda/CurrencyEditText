# The single place where a version number is written down. A coordinate that
# appears in a build script instead of here is a bug, not a shortcut: the point
# of this file is that there is one target to update and one diff to review.
#
# Order inside each table is alphabetical by alias, so a new entry has an obvious
# home and diffs stay readable.

[versions]
# --- toolchain -------------------------------------------------------------
agp = "8.13.0"
kotlin = "2.4.10"
mavenPublish = "0.34.0"

# --- quality gates ---------------------------------------------------------
# The standalone plugin rather than the Kotlin Gradle Plugin's own
# `abiValidation {}`. Kotlin is now new enough for the built-in one, so this
# entry is on its way out: issue #21 replaces it in its own change, where the
# dump's format diff can be reviewed on its own.
binaryCompatibilityValidator = "0.18.2"
# 1.23.8 is the last stable line; detekt 2.x has been in alpha since 2025. See
# the note in the root build script for how its lag behind our Kotlin version is
# checked rather than tolerated.
detekt = "1.23.8"
kover = "0.9.9"
ktlint = "1.8.0"
spotless = "8.9.0"

# --- androidx --------------------------------------------------------------
appcompat = "1.6.1"
constraintlayout = "2.1.4"
coreKtx = "1.10.1"

# --- google ----------------------------------------------------------------
material = "1.9.0"

# --- test ------------------------------------------------------------------
junit = "4.13.2"
mockito = "5.20.0"
testCoreKtx = "1.5.0"
testExtJunitKtx = "1.1.5"
testRules = "1.5.0"
testRunner = "1.5.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "testCoreKtx" }
androidx-test-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "testExtJunitKtx" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "testRules" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
