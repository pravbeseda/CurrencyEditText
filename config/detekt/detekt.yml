# Overrides on top of detekt's default config (`buildUponDefaultConfig = true`),
# so only the deviations live here. The full default set is at
# https://github.com/detekt/detekt/blob/v1.23.8/detekt-core/src/main/resources/default-detekt-config.yml
# The default `build.maxIssues: 0` is kept: with a baseline in place, any finding
# that is not already frozen must fail the build.

style:
  MaxLineLength:
    # ktlint owns line length, through Spotless. Two tools with two different
    # limits would contradict each other on the same line — detekt's default of
    # 120 already disagrees with the 122-character line Spotless accepts today.
    active: false
  ForbiddenComment:
    # A TODO with no ticket is a comment that nobody will ever come back to.
    comments:
      - reason: 'Reference an issue instead, so the debt is tracked outside the code.'
        value: 'TODO:'
      - reason: 'Reference an issue instead, so the debt is tracked outside the code.'
        value: 'FIXME:'
  MagicNumber:
    # Off in tests: an expected value written as a literal is the point of the test.
    excludes: ['**/test/**', '**/androidTest/**']

exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/androidTest/**']
