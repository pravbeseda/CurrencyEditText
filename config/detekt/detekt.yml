# Overrides on top of detekt's default config (`buildUponDefaultConfig = true`),
# so only the deviations live here. The full default set is at
# https://github.com/detekt/detekt/blob/v2.0.0-alpha.6/detekt-core/src/main/resources/default-detekt-config.yml
# Every rule reports at error severity, which is what detekt 2's default
# `failOnSeverity` fails on: with a baseline in place, any finding that is not
# already frozen fails the build.

complexity:
  # One below detekt 2's defaults on purpose: 1.23.x fired at its `threshold`,
  # 2.x fires only above `allowed*`, and detekt lowered the number for some rules
  # but not these four. This keeps the gate where 1.23.8 had it.
  LargeClass:
    allowedLines: 599
  LongMethod:
    allowedLines: 59
  NestedBlockDepth:
    allowedDepth: 3
  TooManyFunctions:
    allowedFunctionsPerFile: 10
    allowedFunctionsPerClass: 10
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 10
    allowedFunctionsPerEnum: 10

style:
  MaxLineLength:
    # ktlint owns line length, through Spotless. Two tools with two different
    # limits would contradict each other on the same line — detekt's default of
    # 120 already disagrees with the 122-character line Spotless accepts today.
    active: false
  ForbiddenComment:
    # Only the reason text deviates from the default: a marker with no ticket is
    # a comment that nobody will ever come back to. The three values are the
    # default's own, restated because a list-valued key is replaced rather than
    # merged — dropping one here would quietly stop forbidding it.
    comments:
      - reason: 'Reference an issue instead, so the debt is tracked outside the code.'
        value: 'TODO:'
      - reason: 'Reference an issue instead, so the debt is tracked outside the code.'
        value: 'FIXME:'
      - reason: 'Reference an issue instead, so the debt is tracked outside the code.'
        value: 'STOPSHIP:'
  MagicNumber:
    # detekt 2 stopped checking literals in property and local declarations;
    # 1.23.x checked them, and naming the number is the point of the rule.
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
